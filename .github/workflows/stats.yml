name: Stats

# Pulls performance back onto published items once a day. Read-only against the
# platforms; the only writes are to the queue.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: content-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Collect stats
        run: npm run stats

      - name: Commit stats
        run: |
          git config user.name  "content-engine[bot]"
          git config user.email "content-engine[bot]@users.noreply.github.com"
          git add queue
          git diff --cached --quiet && exit 0
          git commit -m "chore(stats): $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
