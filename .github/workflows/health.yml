name: Health

# The watchdog. A 24/7 pipeline that silently stops is the failure mode that costs
# the most, so this runs daily and opens a single tracking issue when the channel is
# about to go dark — reusing the same issue rather than filing a new one each day.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Check pipeline health
        id: check
        continue-on-error: true
        # `npm run health` exits non-zero when a live channel is about to go dark, and
        # a pipe would swallow that. Capture the report, then re-raise the status.
        run: |
          set -o pipefail
          npm run health | tee health-report.md

      - name: Open or update the health issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('health-report.md', 'utf8');
            const title = 'Pipeline health: attention needed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-health',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['pipeline-health'],
              });
            }
